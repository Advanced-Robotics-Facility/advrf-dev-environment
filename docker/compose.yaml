services:
  workspace:
    image: miranda-workspace:jazzy
    platform: linux/amd64
    network_mode: host
    environment:
      ROS_DOMAIN_ID: '42'
      # ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}  <-- that instruction will use local ROS_DOMAIN_ID, with fallback to 42
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: '1'
      XAUTHORITY: /tmp/host.xauthority
      XDG_RUNTIME_DIR: /tmp/runtime-root
      LIBGL_ALWAYS_SOFTWARE: '1'
    tmpfs:
      - /tmp/runtime-root:mode=0700,uid=0,gid=0
    volumes:
      - ${X11_SOCKET_DIR:-/tmp/.X11-unix}:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-/dev/null}:/tmp/host.xauthority:ro
      - ../ros2_overlay/src:/ws/user_ros2_ws/src
      - ros2_user_build:/ws/user_ros2_ws/build
      - ros2_user_install:/ws/user_ros2_ws/install
      - ros2_user_log:/ws/user_ros2_ws/log
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1
    stdin_open: true
    tty: true
    devices:
      - /dev/input/:/dev/input/

volumes:
  ros2_user_build:
  ros2_user_install:
  ros2_user_log:
