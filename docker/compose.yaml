services:
  dependencies:
    image: miranda-dependencies:jazzy
    platform: linux/amd64
    profiles: [build]
    build:
      context: .
      dockerfile: Dockerfile.dependencies

  ethercat:
    image: miranda-ethercat:jazzy
    platform: linux/amd64
    profiles: [build]
    build:
      context: .
      dockerfile: Dockerfile.ethercat
      additional_contexts:
        dependencies: service:dependencies
      args:
        BUILD_JOBS: ${BUILD_JOBS:-4}
        BUILD_GUI: ${BUILD_GUI:-ON}
        MASTER_VERSION: ${MASTER_VERSION:-1.0.0}

  workspace:
    image: miranda-workspace:jazzy
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.ros
      additional_contexts:
        ethercat: service:ethercat
      args:
        BUILD_JOBS: ${BUILD_JOBS:-4}
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: '1'
      XAUTHORITY: /tmp/host.xauthority
      XDG_RUNTIME_DIR: /tmp/runtime-root
      LIBGL_ALWAYS_SOFTWARE: '1'
    tmpfs:
      - /tmp/runtime-root:mode=0700,uid=0,gid=0
    volumes:
      - ${X11_SOCKET_DIR:-/tmp/.X11-unix}:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-/dev/null}:/tmp/host.xauthority:ro
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1
    stdin_open: true
    tty: true
    devices:
      - /dev/input/:/dev/input/